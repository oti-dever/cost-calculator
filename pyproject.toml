[project]
name = "cost-calculator"
version = "0.1.0"
description = "E-commerce order cost calculator and shop statistics generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "厦门雾里红电子商务有限公司"}
]

[project.scripts]
cost-calculator = "cost_calculator:main"

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
